[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "melmapo"
version = "1.0.0"
description = "Herramienta de enumeracion y escaneo para la fase de reconocimiento en pentesting interno (TFM)"
readme = "README.md"
requires-python = ">=3.11"
license = { text = "GPL-3.0-only" }
authors = [
    { name = "Inor6040" }
]
classifiers = [
    "Development Status :: 5 - Production/Stable",
    "Intended Audience :: Information Technology",
    "License :: OSI Approved :: GNU General Public License v3 (GPLv3)",
    "Programming Language :: Python :: 3.11",
    "Topic :: Security",
]
dependencies = ["scapy>=2.7.0"]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "ruff>=0.6",
]

[project.scripts]
melmapo = "melmapo.cli:main"

[tool.hatch.build.targets.wheel]
packages = ["melmapo"]

[tool.ruff]
target-version = "py311"
line-length = 100

[tool.pytest.ini_options]
testpaths = ["tests"]
